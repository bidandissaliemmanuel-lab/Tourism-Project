<!DOCTYPE html>
<html lang="en">
<head>
    <title>Explore Uganda Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!--TOP DESTINATIONS-THE 4 CARDS-->
<section class="TOP DESTINATIONS">
   <div class="title row">
   <span></span>
   <h2><CENTER>CARDS</CENTER></h2>
   <span></span>
</div>

    <div class="cards">

     <!--Card 1-->
    <div class="card">
    <img src="Bwindi Impenetrable.jpg" alt="Bwindi Forest">
    <div class="card-text">Bwindi Impenetrable Park</div>
</div>



    <!--Card 2-->
    <div class="card">
    <img src="victoria.jpg" alt="Lake Victoria">
    <div class="card-text">Lake Victoria</div>
</div>

    <!--Card 3-->
    <div class="card">
    <img src="queen.jpg" alt="Queen Elizabeth National Park">
    <div class="card-text">Queen Elizabeth National Park</div>
</div>

    <!--Card 4-->
    <div class="card">
    <img src="murchison.jpg" alt="Murchison Falls">
    <div class="card-text">Murchison Falls National Park</div>
    </div>
</div>
</section>

</body>
</html>
